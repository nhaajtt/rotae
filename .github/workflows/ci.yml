# Checks that every push builds. Releases are built and signed locally, so no signing key
# is stored on GitHub.
name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['website/**', 'docs/**', 'film/**', '**.md']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Known vulnerabilities in packages the app ships
        run: npm audit --omit=dev

      - name: Build web UI
        run: npm run build

      - name: PDF engine
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: FFmpeg for the engine tests
        run: choco install ffmpeg -y --no-progress

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Engine tests
        working-directory: src-tauri
        run: cargo test --lib --locked

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: System libraries and the tools the engines call
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev             libarchive-tools ffmpeg tesseract-ocr tesseract-ocr-vie xclip xvfb fonts-dejavu-core

      - name: Install
        run: npm ci

      - name: Build web UI
        run: npm run build

      - name: PDF engine
        run: sh scripts/fetch-pdfium.sh

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Engine tests
        working-directory: src-tauri
        # the runner's Chrome can't start its own sandbox under Ubuntu's AppArmor rules, and the
        # bubblewrap tests skip themselves there for the same reason
        env:
          ROTAE_SKIP_PDF_PRINT: '1'
        run: xvfb-run -a cargo test --lib --locked

  # macos-15 proves the app still builds where there is no Liquid Glass (older Xcode, drawn
  # look); macos-26 builds what ships.
  mac-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Homebrew's plain ffmpeg leaves out libvorbis, AV1 and drawtext, which the tests use;
      # ffmpeg-full is keg-only, so put it on PATH
      - name: ffmpeg
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: mac/scripts/fetch-pdfium.sh
      - run: swift build -c release
        working-directory: mac
      - run: .build/release/sd-selftest
        working-directory: mac
      - run: rustup component add clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: mac/engine
      - run: SD_NATIVE="$PWD/../.build/release/sd-native" cargo test --locked
        working-directory: mac/engine
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: mac/engine
      - name: Build the app bundle
        run: mac/scripts/build-app.sh
      - name: The shipping build has the current design, icon and Shortcuts actions
        if: matrix.os == 'macos-26'
        run: |
          A=mac/build/Rotae.app/Contents
          sdk="$(xcrun vtool -show-build "$A/MacOS/Rotae" | awk '/sdk/{print int($2)}')"
          [ "$sdk" -ge 26 ] || { echo "built against SDK $sdk, need 26+"; exit 1; }
          [ -f "$A/Resources/Assets.car" ] || { echo "no layered icon (Assets.car)"; exit 1; }
          [ -f "$A/Resources/Metadata.appintents/extract.actionsdata" ] || { echo "no Shortcuts metadata"; exit 1; }

  # RustSec advisories for every crate in Cargo.lock
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        working-directory: src-tauri
        run: cargo audit
